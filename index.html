<!doctype html>
<html lang="ko" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&amp;family=Great+Vibes&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2523;--sub:#8a7a72;--ac:#d9a5ad;--ln:#ece3da;--bl:#5b8def;--rd:#c9848e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1d1816;--card:#292220;--tx:#efe5de;--sub:#b5a59c;--ac:#d9a39e;--ln:#3b312d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nanum Myeongjo','Noto Serif KR','Apple SD Gothic Neo',serif;line-height:1.9;text-align:center}
#app{max-width:480px;margin:0 auto;background:var(--bg);padding-bottom:80px}
section{padding:56px 24px}
h2{font:400 15px 'Great Vibes',cursive;letter-spacing:.12em;color:var(--ac);margin:0 0 6px;font-size:20px}
h3{font-size:16px;margin:0 0 24px;font-weight:700}
.hero{height:100vh;max-height:860px;position:relative;background:linear-gradient(170deg,#ecd3d6,#f6e6e3 55%,#e9cfd3) center/cover;color:#fff;overflow:hidden}
.hero .t{position:absolute;left:0;right:0;font:400 54px/1.1 'Great Vibes',cursive;text-shadow:0 2px 14px #0004}
.hero .t1{top:6%}.hero .t2{bottom:24%;font-size:64px}

.pre{white-space:pre-line}
.line{display:block;border-bottom:1px solid var(--ln);max-width:230px;margin:0 auto}
.frame{background:var(--card);border:1px solid var(--ln);padding:20px;margin:40px 8px 0}
.sl{background:var(--ln) center/cover;position:relative;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;overflow:hidden}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.frame .sl{aspect-ratio:4/5}
.par{display:flex;justify-content:center;gap:8px;font-size:15px;margin:6px 0}
.ci{display:flex;justify-content:center;align-items:center;gap:14px}
.ci>div{flex:0 0 42%;min-width:0}.ci .sl{width:100%;height:auto;aspect-ratio:1/1;border-radius:50%;overflow:hidden}.ci .sl img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ci i{color:var(--ac);font-style:normal}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;max-width:340px;margin:24px auto;font-size:15px}
.cal b{font-weight:700}.cal .su,.cal b:first-child{color:var(--rd)}.cal .sa,.cal b:last-child{color:var(--bl)}
.cal .on{background:var(--ac);color:#fff;border-radius:50%;width:32px;height:32px;line-height:32px;margin:auto}
.cd{display:flex;justify-content:center;align-items:center;gap:6px;margin:10px 0 22px}

.cd small{display:block;font-size:11px}
.gal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,168px);grid-auto-columns:126px;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 4px}
.gal .sl{scroll-snap-align:start;border-radius:4px}
.gal .sl{width:100%;height:100%}
.edit .sl{cursor:pointer;outline:1px dashed var(--ac)}
.sl i{position:absolute;top:2px;right:4px;font-style:normal;background:#0008;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px}
.hint{font-size:12px;color:var(--sub)}
.acc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0;text-align:left;font-size:14px}
.acc b{color:var(--ac);font-size:12px;display:block}
.btn{font:inherit;font-size:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:12px 26px;cursor:pointer;margin:4px;text-decoration:none;display:inline-block}
.map{aspect-ratio:4/3;border-radius:10px;margin:16px 0}
.edit [data-k],.edit [data-a]{outline:1px dashed var(--ac);min-width:2em;display:inline-block;padding:0 4px}
.fab{position:fixed;z-index:20;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--ac);font-size:18px;cursor:pointer;box-shadow:0 2px 10px #0003}
#mus{right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
#ed{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:auto;padding:0 16px;font:inherit;font-size:14px;border-radius:21px}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;gap:12px;z-index:15}
.bar button{font:inherit;font-size:14px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:24px;padding:12px 18px;box-shadow:0 2px 12px #0002;cursor:pointer}
#lb,#md{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:30}
#lb{animation:lbin .16s ease-out}
@keyframes lbin{from{opacity:0}to{opacity:1}}
#lb img{max-width:94vw;max-height:82vh;max-height:82dvh;object-fit:contain;border-radius:3px;box-shadow:0 10px 40px #0009;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:#ffffff26;color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#lb .x:active{background:#ffffff45}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:72px;padding:0;border:0;border-radius:12px;background:#ffffff1f;color:#fff;font-size:34px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 6px #0006}
#lb .nv:active{background:#ffffff3d}
#lb .pv{left:8px}#lb .nx{right:8px}
#lb .ct{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);color:#fff;opacity:.92;font:400 13px/1.4 -apple-system,'Apple SD Gothic Neo',sans-serif;letter-spacing:.1em;text-shadow:0 1px 6px #0008}
#md div{background:var(--card);color:var(--tx);border-radius:14px;padding:24px;width:86%;max-width:360px;line-height:2}
#md input,#md select{font:inherit;width:100%;padding:8px;margin:4px 0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.tr{text-align:left;font-size:14px}.tr h4{display:flex;align-items:center;gap:10px;font-size:16px;margin:28px 0 10px;padding-bottom:10px;border-bottom:1px dotted var(--ln)}.tr h4 s{text-decoration:none;width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;background:var(--card);border:1px solid var(--ln)}.tr div{margin:4px 0}
.ft{font-size:12px;color:var(--sub);padding:30px}

<script>
const S=JSON.parse(document.getElementById('d').textContent);
let ed=false,AS=null,AR=null,UR=null,mOn=false,mUser=null,big=false;

 const d=new Date(S.date+'T00:00:00'),y=d.getFullYear(),m=d.getMonth(),W='일월화수목금토'[d.getDay()];

 const dd=Math.ceil((d-new Date().setHours(0,0,0,0))/864e5),fst=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();
 let cal='<b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b>'+'<span></span>'.repeat(fst);

/* 직접 합성한 잔잔한 피아노 선율 (저작권 없음) */
let ac,mt,step=0,nt=0,wet,dry;
const F=m=>440*2**((m-69)/12);
const CH=[[48,0],[43,0],[45,1],[40,1],[41,0],[48,0],[41,0],[43,0]];
const ML=[76,79,74,71,72,76,79,76,69,72,76,72,77,81,79,74],AP=[0,2,1,2,3,2,1,2];
const ivl=q=>q?[0,3,7,12]:[0,4,7,12];
function pn(f,t,v,d){const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 [[1,1],[2,.35],[3,.12],[4,.05]].forEach(([k,a])=>{const o=ac.createOscillator(),h=ac.createGain();o.frequency.value=f*k;h.gain.value=a;o.connect(h);h.connect(g);o.start(t);o.stop(t+d+.1)});
 g.connect(dry);g.connect(wet)}
function pad(fs,t,d){fs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+1.5);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(wet);g.connect(dry);o.start(t);o.stop(t+d+.1)})}
function sched(){while(nt<ac.currentTime+.8){const b=Math.floor(step/8)%8,s=step%8,[r,q]=CH[b],iv=ivl(q);
 if(s==0){pn(F(r),nt,.16,3.5);pad(iv.slice(0,3).map(i=>F(r+12+i)),nt,4.6)}
 pn(F(r+12+iv[AP[s]]),nt,.07,1.8);
 if(s%4==0)pn(F(ML[(b*2+s/4)%16]),nt,.11,2.6);
 step++;nt+=.55}}
function tog(u){if(u)mUser=!mOn;
 if(mOn){clearInterval(mt);ac.suspend();mOn=false}else{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.connect(ac.destination);dry=ac.createGain();dry.connect(lp);
   const cv=ac.createConvolver(),n=ac.sampleRate*2.6|0,ib=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2)}
   cv.buffer=ib;wet=ac.createGain();wet.gain.value=.45;wet.connect(cv);cv.connect(lp)}
  ac.resume();nt=ac.currentTime+.1;mt=setInterval(sched,250);mOn=true}
 const b=document.getElementById('mus');if(b)b.textContent=mOn?'♪':'♪̸'}

/* 라이트박스: 좌우 화살표·스와이프·현재 순서 */
const LB={arr:[],at:0,multi:false,x0:0,y0:0,dx:0};
function openLB(k){const u=get(k);if(!u)return;
 if(isP(k)){const arr=S.photos.map((x,i)=>x?{u:x,k:'p'+i}:null).filter(Boolean);const at=arr.findIndex(o=>o.k===k);if(at<0)return;LB.arr=arr;LB.at=at;LB.multi=arr.length>1}
 else{LB.arr=[{u:u,k:k}];LB.at=0;LB.multi=false}
 drawLB()}
function drawLB(){let l=document.getElementById('lb');
 if(!l){l=document.createElement('div');l.id='lb';document.body.append(l);
  l.addEventListener('click',e=>{if(e.target===l)closeLB()});
  l.addEventListener('touchstart',e=>{LB.x0=e.touches[0].clientX;LB.y0=e.touches[0].clientY;LB.dx=0},{passive:true});
  l.addEventListener('touchmove',e=>{LB.dx=e.touches[0].clientX-LB.x0},{passive:true});
  l.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-LB.y0;if(Math.abs(LB.dx)>40&&Math.abs(LB.dx)>Math.abs(dy))lbStep(LB.dx<0?1:-1)});
  document.body.style.overflow='hidden'}
 const o=LB.arr[LB.at];
 l.innerHTML=`<button class="x" data-lb="c" aria-label="닫기">×</button>${LB.multi?`<button class="nv pv" data-lb="p" aria-label="이전 사진">‹</button><button class="nv nx" data-lb="n" aria-label="다음 사진">›</button><div class="ct">${LB.at+1} / ${LB.arr.length}</div>`:''}<img src="${esc(o.u)}" alt="">`;
 if(LB.multi)[1,-1].forEach(d=>{const n=LB.arr[(LB.at+d+LB.arr.length)%LB.arr.length];if(n){const im=new Image();im.src=n.u}})}
function lbStep(d){if(!LB.multi)return;LB.at=(LB.at+d+LB.arr.length)%LB.arr.length;drawLB()}
function closeLB(){const l=document.getElementById('lb');if(l)l.remove();document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(!document.getElementById('lb'))return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='ArrowLeft')lbStep(-1)});
render();
